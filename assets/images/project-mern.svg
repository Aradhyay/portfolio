<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="mernBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="50%" stop-color="#14192b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="reactCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#61dafb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="nodeGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="goldMern" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffdb70"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="360" rx="16" fill="url(#mernBg)"/>

  <!-- Title -->
  <text x="300" y="38" font-family="'Poppins', sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MERN FULL-STACK CLOUD PLATFORM</text>

  <!-- Browser UI Mockup Frame -->
  <rect x="70" y="65" width="460" height="230" rx="10" fill="#131a29" stroke="#334155" stroke-width="1.5"/>
  <rect x="70" y="65" width="460" height="30" rx="10" fill="#1e293b"/>
  <circle cx="90" cy="80" r="5" fill="#ef4444"/>
  <circle cx="106" cy="80" r="5" fill="#eab308"/>
  <circle cx="122" cy="80" r="5" fill="#22c55e"/>
  <!-- URL Bar -->
  <rect x="150" y="72" width="300" height="16" rx="8" fill="#0f172a"/>
  <text x="300" y="84" font-family="'Poppins', sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">https://localhost:3000/dashboard</text>

  <!-- Central React Atom Orbit -->
  <g transform="translate(300, 180)">
    <circle cx="0" cy="0" r="14" fill="url(#reactCyan)"/>
    <ellipse cx="0" cy="0" rx="55" ry="20" fill="none" stroke="#61dafb" stroke-width="2" transform="rotate(0)" stroke-opacity="0.8"/>
    <ellipse cx="0" cy="0" rx="55" ry="20" fill="none" stroke="#61dafb" stroke-width="2" transform="rotate(60)" stroke-opacity="0.8"/>
    <ellipse cx="0" cy="0" rx="55" ry="20" fill="none" stroke="#61dafb" stroke-width="2" transform="rotate(120)" stroke-opacity="0.8"/>
  </g>

  <!-- Stack badges left & right -->
  <g transform="translate(100, 130)">
    <rect width="100" height="35" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="50" y="22" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#22c55e" text-anchor="middle">MongoDB</text>
  </g>
  <g transform="translate(100, 190)">
    <rect width="100" height="35" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="50" y="22" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#f59e0b" text-anchor="middle">Express.js</text>
  </g>
  <g transform="translate(400, 130)">
    <rect width="100" height="35" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="50" y="22" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#61dafb" text-anchor="middle">React 18</text>
  </g>
  <g transform="translate(400, 190)">
    <rect width="100" height="35" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="50" y="22" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#4ade80" text-anchor="middle">Node.js</text>
  </g>

  <!-- Badges at bottom -->
  <g transform="translate(150, 310)">
    <rect width="130" height="26" rx="13" fill="#1e293b" stroke="url(#goldMern)" stroke-width="1"/>
    <text x="65" y="17" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#ffdb70" text-anchor="middle">EY GDS &amp; AICTE</text>
  </g>
  <g transform="translate(300, 310)">
    <rect width="150" height="26" rx="13" fill="#1e293b" stroke="#61dafb" stroke-width="1"/>
    <text x="75" y="17" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#61dafb" text-anchor="middle">Full Stack Next Gen</text>
  </g>
</svg>
