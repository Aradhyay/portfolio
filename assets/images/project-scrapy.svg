<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="scBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1320"/>
      <stop offset="50%" stop-color="#111f38"/>
      <stop offset="100%" stop-color="#0b1320"/>
    </linearGradient>
    <linearGradient id="scGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="scGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffdb70"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="360" rx="16" fill="url(#scBg)"/>

  <!-- Title -->
  <text x="300" y="38" font-family="'Poppins', sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">AUTOMATED WEB EXTRACTION ENGINE &amp; ETL</text>

  <!-- Web Scraping Spiders & Data Stream Visual -->
  <!-- Target Web Sources Box -->
  <rect x="50" y="80" width="120" height="180" rx="10" fill="#131b2e" stroke="#334155" stroke-width="1.5"/>
  <rect x="50" y="80" width="120" height="28" rx="10" fill="#1e293b"/>
  <circle cx="65" cy="94" r="4" fill="#ef4444"/>
  <circle cx="78" cy="94" r="4" fill="#eab308"/>
  <circle cx="91" cy="94" r="4" fill="#22c55e"/>
  <text x="110" y="140" font-family="'Poppins', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">E-Commerce</text>
  <text x="110" y="165" font-family="'Poppins', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Catalog Sites</text>
  <text x="110" y="190" font-family="'Poppins', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Target APIs</text>
  <text x="110" y="235" font-family="'Poppins', sans-serif" font-size="9" fill="#ffdb70" text-anchor="middle">1000+ Items/Run</text>

  <!-- Middle Engine: Scrapy Core & Middlewares -->
  <rect x="230" y="65" width="140" height="210" rx="12" fill="#152238" stroke="url(#scGreen)" stroke-width="2"/>
  <text x="300" y="98" font-family="'Poppins', sans-serif" font-size="14" font-weight="700" fill="#4ade80" text-anchor="middle">SCRAPY CORE</text>
  
  <rect x="245" y="115" width="110" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="300" y="134" font-family="'Poppins', sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">Custom Spiders</text>
  
  <rect x="245" y="155" width="110" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="300" y="174" font-family="'Poppins', sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">Proxy &amp; UA Rotation</text>

  <rect x="245" y="195" width="110" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="300" y="214" font-family="'Poppins', sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">Anti-Bot Bypass</text>
  
  <rect x="245" y="235" width="110" height="25" rx="6" fill="#1e293b" stroke="url(#scGold)" stroke-width="1"/>
  <text x="300" y="251" font-family="'Poppins', sans-serif" font-size="9" font-weight="600" fill="#ffdb70" text-anchor="middle">ETL Cleaning Pipeline</text>

  <!-- Output Storage: MySQL & JSON Datasets -->
  <rect x="430" y="80" width="120" height="180" rx="10" fill="#131b2e" stroke="#334155" stroke-width="1.5"/>
  <rect x="430" y="80" width="120" height="28" rx="10" fill="#1e293b"/>
  <text x="490" y="99" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">STORAGE</text>
  <text x="490" y="135" font-family="'Poppins', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">MySQL DB</text>
  <text x="490" y="160" font-family="'Poppins', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">JSON Exports</text>
  <text x="490" y="185" font-family="'Poppins', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Clean Datasets</text>
  <text x="490" y="235" font-family="'Poppins', sans-serif" font-size="9" fill="#4ade80" text-anchor="middle">Validated Data</text>

  <!-- Connecting Arrows -->
  <path d="M175 170 L225 170" stroke="url(#scGreen)" stroke-width="2.5" stroke-dasharray="6 3"/>
  <path d="M375 170 L425 170" stroke="url(#scGold)" stroke-width="2.5" stroke-dasharray="6 3"/>

  <!-- Badges at bottom -->
  <g transform="translate(140, 300)">
    <rect width="90" height="26" rx="13" fill="#1e293b" stroke="url(#scGreen)" stroke-width="1"/>
    <text x="45" y="17" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#4ade80" text-anchor="middle">Scrapy • ETL</text>
  </g>
  <g transform="translate(245, 300)">
    <rect width="110" height="26" rx="13" fill="#1e293b" stroke="url(#scGold)" stroke-width="1"/>
    <text x="55" y="17" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#ffdb70" text-anchor="middle">MySQL &amp; JSON</text>
  </g>
  <g transform="translate(370, 300)">
    <rect width="95" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="47" y="17" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">Python 3.x</text>
  </g>
</svg>
