<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2b36"/>
      <stop offset="100%" stop-color="#15161a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffdb70"/>
      <stop offset="100%" stop-color="#e5a93b"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect width="200" height="200" rx="35" fill="url(#avatarGrad)"/>
  
  <!-- Outer subtle tech ring -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="#353745" stroke-width="2"/>
  <circle cx="100" cy="100" r="76" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" stroke-dasharray="8 6"/>

  <!-- Developer Silhouette / Character -->
  <!-- Shoulders -->
  <path d="M48 165 C50 128, 75 118, 100 118 C125 118, 150 128, 152 165 Z" fill="url(#accentGrad)" opacity="0.95"/>
  <!-- Head -->
  <circle cx="100" cy="78" r="32" fill="url(#accentGrad)"/>
  
  <!-- Modern Stylish Glasses -->
  <path d="M83 74 Q92 77 100 74 Q108 77 117 74" fill="none" stroke="#1c1d22" stroke-width="3" stroke-linecap="round"/>
  <rect x="76" y="70" width="18" height="12" rx="3" fill="#1c1d22" opacity="0.85"/>
  <rect x="106" y="70" width="18" height="12" rx="3" fill="#1c1d22" opacity="0.85"/>
  
  <!-- AI / Code Badge -->
  <g transform="translate(142, 38)">
    <circle cx="14" cy="14" r="16" fill="#1c1d24" stroke="url(#accentGrad)" stroke-width="2"/>
    <text x="14" y="18" font-family="'Poppins', sans-serif" font-size="9" font-weight="700" fill="#ffdb70" text-anchor="middle">&lt;/&gt;</text>
  </g>
  
  <!-- ML Node Connection Badge -->
  <g transform="translate(18, 138)">
    <circle cx="14" cy="14" r="14" fill="#1c1d24" stroke="url(#cyanGrad)" stroke-width="1.5"/>
    <text x="14" y="18" font-family="'Poppins', sans-serif" font-size="9" font-weight="700" fill="#38bdf8" text-anchor="middle">AI</text>
  </g>
</svg>
