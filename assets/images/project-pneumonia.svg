<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="pneuBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffdb70"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="360" rx="16" fill="url(#pneuBg)"/>
  
  <!-- Subtle grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="90" x2="600" y2="90"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="270" x2="600" y2="270"/>
    <line x1="150" y1="0" x2="150" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="450" y1="0" x2="450" y2="360"/>
  </g>

  <!-- Glowing background behind lungs -->
  <circle cx="300" cy="180" r="140" fill="url(#glow)"/>

  <!-- Stylized Medical X-Ray Frame -->
  <rect x="170" y="55" width="260" height="250" rx="12" fill="#090d16" stroke="url(#cyan)" stroke-width="1.5" stroke-opacity="0.6"/>
  
  <!-- Lung Silhouettes / Chest X-Ray -->
  <path d="M250 110 C210 120 190 170 200 220 C206 248 230 265 255 255 C265 250 270 220 270 190 C270 160 265 115 250 110 Z" fill="#38bdf8" fill-opacity="0.25" stroke="#38bdf8" stroke-width="2"/>
  <path d="M350 110 C390 120 410 170 400 220 C394 248 370 265 345 255 C335 250 330 220 330 190 C330 160 335 115 350 110 Z" fill="#38bdf8" fill-opacity="0.25" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Central Trachea / Spine -->
  <line x1="300" y1="95" x2="300" y2="265" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6 4" stroke-opacity="0.5"/>
  
  <!-- Neural Network Heatmap / Detection Box -->
  <rect x="205" y="150" width="70" height="70" rx="6" fill="#f43f5e" fill-opacity="0.25" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4 2"/>
  <text x="210" y="142" font-family="'Poppins', sans-serif" font-size="10" font-weight="600" fill="#f43f5e">Infiltrate Detected (98.4%)</text>
  
  <!-- ResNet-18 Neural Network Nodes -->
  <g transform="translate(60, 110)">
    <circle cx="0" cy="30" r="7" fill="url(#gold)"/>
    <circle cx="0" cy="80" r="7" fill="url(#gold)"/>
    <circle cx="0" cy="130" r="7" fill="url(#gold)"/>
    
    <circle cx="50" cy="55" r="7" fill="url(#cyan)"/>
    <circle cx="50" cy="105" r="7" fill="url(#cyan)"/>
    
    <line x1="0" y1="30" x2="50" y2="55" stroke="#ffffff" stroke-opacity="0.3"/>
    <line x1="0" y1="80" x2="50" y2="55" stroke="#ffffff" stroke-opacity="0.3"/>
    <line x1="0" y1="80" x2="50" y2="105" stroke="#ffffff" stroke-opacity="0.3"/>
    <line x1="0" y1="130" x2="50" y2="105" stroke="#ffffff" stroke-opacity="0.3"/>
  </g>
  
  <!-- Badges at bottom -->
  <g transform="translate(180, 290)">
    <rect width="105" height="26" rx="13" fill="#1e293b" stroke="url(#gold)" stroke-width="1"/>
    <text x="52" y="17" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#ffdb70" text-anchor="middle">PyTorch • ResNet-18</text>
  </g>
  <g transform="translate(300, 290)">
    <rect width="115" height="26" rx="13" fill="#1e293b" stroke="url(#cyan)" stroke-width="1"/>
    <text x="57" y="17" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">Java Swing Bridge</text>
  </g>
  
  <text x="300" y="38" font-family="'Poppins', sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">PNEUMONIA DETECTION AI SYSTEM</text>
</svg>
